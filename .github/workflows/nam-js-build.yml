name: Build offline NAM JavaScript DSP
on:
  push:
    branches: [feat/nam-js-only-dsp-20261010]
  workflow_dispatch:
  pull_request:
    branches: [main]
concurrency:
  group: nam-js-build-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          persist-credentials: true
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - name: Compile self-contained SonicMaster Web Worker
        run: dart compile js tools/nam_js/worker.dart --output=src/assets/nam_dsp_worker.js -O3
      - name: Download pinned reference DI and compress reproducibly
        run: |
          python3 tools/nam_js/fetch_reference.py
          python3 - <<'PY'
          from pathlib import Path
          import gzip
          source = Path("tools/nam_js/data/nam_reference_di_44100.f32")
          target = Path("src/assets/nam_reference_di_44100.f32.gz")
          target.write_bytes(gzip.compress(source.read_bytes(), compresslevel=9, mtime=0))
          print(f"Offline DI gzip asset: {target.stat().st_size} bytes")
          PY
      - name: Assemble standalone HTML
        run: node src/build_studio.js
      - name: JavaScript regression tests
        run: node --test tests/*.cjs
      - name: Server security tests
        run: python3 -m unittest discover -s tests -p 'test_studio_server.py' -v
      - name: Full 5-level numerical golden parity using compiled JS Workers
        timeout-minutes: 12
        run: node tools/nam_js/verify_golden.cjs
      - name: Commit generated JS and offline DI
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f src/assets/nam_dsp_worker.js src/assets/nam_reference_di_44100.f32.gz
          git add PocketMasterStudio.html README.md src/README_STUDIO.md tests/fixtures/sonicmaster_native_dsp_ref.clo.b64
          if ! git diff --cached --quiet; then
            git commit -m "build(nam-js): bundle compiled SonicMaster DSP and pinned offline reference DI"
            # The HTML builder may also update local README/changelog baselines.
            # Keep the built artifact commit, discard only leftover unstaged CI dirt.
            git reset --hard HEAD
            git fetch origin feat/nam-js-only-dsp-20261010
            git rebase origin/feat/nam-js-only-dsp-20261010
            git push origin HEAD:feat/nam-js-only-dsp-20261010
          fi
