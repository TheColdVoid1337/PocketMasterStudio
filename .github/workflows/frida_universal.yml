name: Universal Frida offline contract

on:
  push:
    paths:
      - 'tools/frida_capture.py'
      - 'tools/frida_guarded.py'
      - 'tools/FRIDA_WSL.sh'
      - 'tools/test_frida_universal.py'
      - 'research/htkpa/stages/**/frida.json'
      - '.github/workflows/frida_universal.yml'
  pull_request:
    paths:
      - 'tools/frida_capture.py'
      - 'tools/frida_guarded.py'
      - 'tools/FRIDA_WSL.sh'
      - 'tools/test_frida_universal.py'
      - 'research/htkpa/stages/**/frida.json'
      - '.github/workflows/frida_universal.yml'

jobs:
  offline-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile universal Python sources
        run: python -m py_compile tools/frida_capture.py tools/frida_guarded.py tools/test_frida_universal.py
      - name: Universal offline self-test
        run: python tools/frida_capture.py --self-test
      - name: Unit and regression tests
        run: python -m unittest discover -s tools -p 'test_frida_universal.py' -v
      - name: Validate shared WSL wrapper
        run: bash -n tools/FRIDA_WSL.sh
